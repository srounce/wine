name: Release

on:
  push:
    tags:
      - 'sangria-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get build-dep -y wine
          sudo apt-get install -y flex bison gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 \
            libusb-1.0-0-dev libudev-dev

      - name: Configure
        # A single WoW64 build: 64-bit host libraries serving both 64-bit and
        # 32-bit Windows programs, no 32-bit host toolchain needed.
        run: |
          mkdir build
          cd build
          ../configure --enable-archs=i386,x86_64 --disable-tests \
            --prefix=/opt/wine-sangria

      - name: Build
        run: make -C build -j"$(nproc)"

      - name: Package
        run: |
          make -C build install DESTDIR="$PWD/dist"
          tar -C dist/opt -cJf "wine-${GITHUB_REF_NAME:-manual}-amd64.tar.xz" wine-sangria
          sha256sum wine-*.tar.xz > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-${{ github.ref_name }}
          path: |
            wine-*.tar.xz
            SHA256SUMS

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-pre') || contains(github.ref_name, '-rc') }}
          files: |
            wine-*.tar.xz
            SHA256SUMS
          generate_release_notes: true
